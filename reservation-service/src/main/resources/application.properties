spring.application.name=reservation-service
server.port=8083

# MySQL DataSource
# GDPR: Processes reservation, passenger, PNR. Legal basis: contract. Retention: per policy. DPA: N/A (internal DB).
spring.datasource.url=jdbc:mysql://localhost:3306/reservation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sourabh@71234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Secret (shared with user-service and train-service for token validation)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Internal Service-to-Service Secret (same as train-service)
internal.api.secret=railway-internal-super-secret-key-2026

# Seat hold duration for reservation-service-initiated holds (5 minutes per spec)
reservation.seat-hold-duration-minutes=5

# Eureka Discovery Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# OpenFeign — base URLs (resolved via Eureka by service name)
# train-service runs on http://train-service (port 8082 via Eureka)
# user-service runs on http://user-service (port 8081 via Eureka)
# payment-service runs on http://payment-service (port 8084 via Eureka)
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000
